[project]
name = "math-comp"
version = "0.1.0"
description = "Jupyter + sympy runtime for the math and CS curriculum at bebekim.github.io/curriculum"
requires-python = ">=3.11"
dependencies = [
    # Pin what's actually tested; jupyter itself can float within a major version.
    "sympy==1.14.0",
    "matplotlib==3.10.9",
    "numpy>=1.26",
    "jupyterlab>=4.0,<5",
    "notebook>=7.0,<8",
    "ipykernel>=6.0",
]
